<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>这一餐 · 视觉方向原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:#25352f;font:15px/1.5 'Microsoft YaHei',sans-serif}button,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:default;opacity:.55}button:focus-visible,select:focus-visible{outline:3px solid #da7031;outline-offset:4px}button{border:0} .workspace{display:grid;grid-template-columns:300px 400px;gap:85px;justify-content:center;align-items:center;min-height:100vh;padding:34px 24px 115px}.brief h1{font-size:34px;letter-spacing:-1px;margin:16px 0}.brief p{line-height:1.9;color:#5e6b67}.proto-label{font-size:12px;border:1px solid #89968f;border-radius:6px;display:inline-block;padding:4px 10px}.brief .count{font-size:72px;line-height:1;color:#a6b1ab;font-weight:300}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{font-size:12px;padding:5px 9px;background:#fff8;border-radius:4px}.state{font-size:12px!important;margin-top:30px;border-top:1px solid #bbc6c0;padding-top:16px}.phone{width:400px;min-height:770px;border-radius:38px;border:7px solid #fff;box-shadow:0 20px 70px #223d3220;overflow:hidden;background:var(--paper);color:var(--ink);position:relative;display:flex;flex-direction:column;--accent:#206846;--paper:#fff9e9;--ink:#223e2c}.status{display:flex;justify-content:space-between;padding:13px 24px 4px;font-size:11px;font-weight:bold}.app{flex:1;padding:15px 23px 18px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:bold}.meal{border:0;background:transparent;color:inherit;font-size:13px;padding:8px}.scenes{display:flex;gap:4px;margin:20px 0 15px}.scenes button{flex:1;border-radius:30px;background:transparent;padding:10px 0;font-size:14px}.scenes button.active{background:var(--ink);color:var(--paper)}h2{font-size:30px;line-height:1.35;margin:22px 0 8px;letter-spacing:-1px}.sub{font-size:12px;opacity:.68;margin:0}.modes{display:flex;justify-content:center;gap:20px;margin:18px 0 8px}.modes button{background:none;font-size:12px;padding:6px 8px;border-bottom:2px solid transparent;opacity:.6}.modes button.active{opacity:1;border-color:var(--accent);font-weight:bold}.stage{height:295px;display:flex;align-items:center;justify-content:center;position:relative}.wheel{height:264px;width:264px;position:relative}.wheel svg{width:100%;height:100%;filter:drop-shadow(0 6px 0 #20362616);transition:transform 1.5s cubic-bezier(.16,.7,.1,1)}.pointer{position:absolute;top:-7px;left:calc(50% - 12px);border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--ink);z-index:2}.hub{position:absolute;left:calc(50% - 32px);top:calc(50% - 32px);width:64px;height:64px;background:var(--paper);border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:17px}.primary{width:100%;background:var(--accent);color:white;padding:15px 10px;border-radius:18px;font-weight:bold;font-size:16px}.secondary{background:transparent;padding:9px;font-size:12px;text-decoration:underline}.result{min-height:54px;text-align:center;display:flex;flex-direction:column;justify-content:center;margin:2px 0 12px}.result strong{font-size:23px}.result small{font-size:11px;opacity:.7}.nav{display:flex;border-top:1px solid #68786b25;margin:0 18px;padding:12px 0 17px}.nav button{flex:1;background:none;font-size:11px;display:grid;gap:4px;justify-items:center;opacity:.5}.nav button.active{opacity:1;color:var(--accent);font-weight:bold}.nav svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.6;fill:none}.cards{display:flex;gap:9px;align-items:center;padding:20px 0}.card{width:94px;height:165px;border:1px solid var(--accent);border-radius:14px;color:var(--accent);background:var(--paper);position:relative;box-shadow:0 8px 20px #00000009;transition:transform .4s}.card:before{content:'';position:absolute;inset:7px;border:1px solid currentColor;border-radius:9px;opacity:.4}.card span{font-family:Georgia,serif;font-size:43px;display:block}.card small{font-size:10px;letter-spacing:3px}.card:first-child{transform:rotate(-9deg) translateY(10px)}.card:last-child{transform:rotate(9deg) translateY(10px)}.card.reveal{transform:translateY(-14px);background:var(--accent);color:white}.card.reveal span{font-size:17px;font-family:inherit;writing-mode:vertical-rl;margin:auto;letter-spacing:3px}.card.reveal small{display:none}.B{--paper:#f4f5fb;--ink:#30384e;--accent:#58668e}.B .app{padding:16px 25px}.B .brand{font-size:15px;letter-spacing:5px;font-weight:400}.B h2{font-family:'Songti SC','SimSun',serif;font-size:36px;font-weight:400;text-align:center;margin:27px 0 12px;line-height:1.55}.B .sub{text-align:center}.B .scenes{margin:20px 0 10px;border-bottom:1px solid #30384e22;padding-bottom:8px}.B .scenes button{border-radius:0;padding:7px}.B .scenes button.active{background:none;color:var(--accent);box-shadow:inset 0 -2px var(--accent)}.B .stage{height:292px}.B .primary{border-radius:4px;font-weight:400;letter-spacing:3px}.B .modes{margin:9px 0}.B .result strong{font-family:'SimSun',serif;font-weight:400}.B .card{background:#e9edf7}.B .card.reveal{background:var(--accent)}.C{--paper:#f9f9f4;--ink:#303a42;--accent:#b64734}.C .top{padding:4px 0 16px;border-bottom:2px solid var(--ink)}.C .brand{font-size:23px}.C .scenes{margin:16px 0}.C .scenes button{border-radius:5px}.C .scenes button.active{background:var(--accent)}.ticket{border:1px solid #c6cbc6;padding:18px 14px 14px;background:white;position:relative}.ticket:after{content:'';position:absolute;bottom:59px;left:0;right:0;border-top:1px dashed #b7beb8}.ticket-head{display:flex;justify-content:space-between;align-items:center}.ticket-head h2{font-size:23px;margin:0}.ticket-head span{font-size:11px;background:#f3f3ec;padding:5px 8px}.C .stage{height:266px}.C .wheel{width:230px;height:230px}.C .primary{border-radius:4px}.C .result{margin:11px 0 0}.C .result strong{font-size:22px}.C .modes{justify-content:flex-start;margin:4px 0 0;gap:12px}.C .card{width:83px;height:155px;border-radius:3px}.C .card:before{border-radius:0}.C .nav{margin-top:14px}.C .sub{margin:14px 0 13px}.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:15px;align-items:center;background:#24372f;color:white;border-radius:40px;padding:9px;z-index:5;box-shadow:0 6px 25px #0003;white-space:nowrap}.switcher button{width:42px;height:42px;border-radius:50%;background:#ffffff20;color:white;font-size:23px}.switcher span{font-size:13px;min-width:160px;text-align:center}.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:#25352f;color:white;padding:12px 22px;border-radius:10px;z-index:10;max-width:90vw;font-size:13px}.toast:empty{display:none}dialog{border:0;border-radius:20px;padding:25px;max-width:340px;width:90%;color:#25352f}dialog::backdrop{background:#12241e66}dialog h3{margin-top:0}dialog p{font-size:14px}dialog button{background:#edf0ed;padding:11px 17px;border-radius:9px;margin:5px 5px 0 0}.listrow{padding:12px 0;border-bottom:1px solid #ddd;font-size:14px}.listrow small{display:block;color:#6a756f}.A .intro{display:flex;justify-content:space-between;align-items:center}.A .intro .seal{width:50px;height:50px;background:#f9ce59;border-radius:50%;font-size:24px;display:grid;place-items:center;transform:rotate(12deg);border:1px solid #223e2c}.A h2{font-size:31px}.A .sub{margin-bottom:2px}@media(max-width:800px){.workspace{display:block;padding:22px 12px 110px}.brief{max-width:400px;margin:auto auto 24px}.brief .count,.brief .chips,.brief .state{display:none}.brief h1{font-size:24px;margin:8px 0}.brief p{font-size:13px;margin:6px 0}.phone{margin:auto;width:min(400px,100%)}.stage{height:280px}.switcher{bottom:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="workspace"><aside class="brief" id="brief"></aside><section class="phone" id="phone" aria-label="手机界面预览"></section></main><div class="switcher" id="switcher"><button aria-label="上一个方案" onclick="cycle(-1)">←</button><span id="variant-label"></span><button aria-label="下一个方案" onclick="cycle(1)">→</button></div><div class="toast" id="toast" role="status"></div><dialog id="dialog"></dialog>
<script>
const variants={A:{name:'开饭游乐场',desc:'让选择像一次小小的游戏。大转盘是主角，圆润按钮和明快的食物色，让每一餐轻松开场。',tags:['奶油黄 / 草木绿','圆润、活泼','转盘优先'],mode:'wheel'},B:{name:'一餐一签',desc:'留一点空白，把注意力交给眼前的选择。安静的蓝灰、舒展的文字，翻开一张属于这一餐的卡。',tags:['雾白 / 蓝灰','克制、有仪式感','抽卡优先'],mode:'cards'},C:{name:'今日饭票',desc:'像走进熟悉的小食堂，领一张今天的饭票。紧凑的菜单布局和纸票式结果，更贴近日常吃饭的感觉。',tags:['纸白 / 朱红','亲切、实用','饭票式布局'],mode:'wheel'}};
const pools=[['黄焖鸡米饭','牛肉面','汉堡','饺子','披萨','鸡肉饭'],['小葱拌豆腐','番茄炒蛋','红烧肉','蒜蓉西兰花','冬瓜汤','宫保鸡丁'],['海底捞','肯德基','麦当劳','必胜客','家常小馆','街角面馆']];
const icons=['<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 4v17M3 10h18"/>','<circle cx="12" cy="12" r="9"/><path d="m12 6 2 5 4 1-5 2-1 4-2-5-4-1 5-2z"/>','<path d="M5 5h14v16H5zM8 2v6M16 2v6M8 12h8M8 16h5"/>'];
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants[variant])variant='A';
let mode=variants[variant].mode,scene=0,result=null,busy=false,excluded=new Set(),history=[],meal=(()=>{let h=new Date().getHours();return h>=5&&h<11?'早餐':h>=11&&h<16?'午餐':h>=16&&h<21?'晚餐':'夜宵'})();
const el=id=>document.getElementById(id);const candidates=()=>pools[scene].filter(x=>!excluded.has(x));
function sceneButtons(){return '<div class="scenes">'+['吃什么','做什么','去哪吃'].map((n,i)=>`<button class="${scene===i?'active':''}" onclick="setScene(${i})">${n}</button>`).join('')+'</div>'}
function modeButtons(){return `<div class="modes"><button class="${mode==='wheel'?'active':''}" onclick="setMode('wheel')">转盘</button><button class="${mode==='cards'?'active':''}" onclick="setMode('cards')">抽卡</button></div>`}
function wheel(){let names=candidates(),n=names.length;if(!n)return '<p>候选已用完，请恢复本次排除</p>';let colors=variant==='A'?['#f5c64e','#f2de98','#bed4b2','#e5ebcc','#eda77d','#f8e7bd']:variant==='B'?['#cbd3e8','#e5e9f4','#bac6df','#dce2ef','#d0d8e9','#eaeef7']:['#e8b7a7','#f3e5d8','#c9d3c4','#edf0e8','#dfc8b8','#f1e9de'];let paths=names.map((name,i)=>{let a=(i*360/n-90)*Math.PI/180,b=((i+1)*360/n-90)*Math.PI/180,m=(a+b)/2;let p=n===1?`<circle cx="140" cy="140" r="135" fill="${colors[i]}"/>`:`<path d="M140 140 L${140+135*Math.cos(a)} ${140+135*Math.sin(a)} A135 135 0 ${360/n>180?1:0} 1 ${140+135*Math.cos(b)} ${140+135*Math.sin(b)} Z" fill="${colors[i%6]}" stroke="${variant==='A'?'#fff9e9':'#fff'}" stroke-width="2"/>`;return p+`<text x="${140+87*Math.cos(m)}" y="${140+87*Math.sin(m)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#273c32" transform="rotate(${(i+.5)*360/n},${140+87*Math.cos(m)},${140+87*Math.sin(m)})">${name}</text>`}).join('');return `<div class="wheel"><div class="pointer"></div><svg id="disc" viewBox="0 0 280 280">${paths}</svg><div class="hub">开饭</div></div>`}
function stage(){return `<div class="stage">${mode==='wheel'?wheel():`<div class="cards">${[0,1,2].map(i=>`<button class="card" id="card${i}" aria-label="翻开第${i+1}张牌" onclick="draw(${i})"><span>${['☼','✧','☾'][i]}</span><small>这一餐</small></button>`).join('')}</div>`}</div>`}
function resultArea(){return `<div class="result" aria-live="polite">${result?`<small>这一餐，就让它来陪你</small><strong>${result}</strong>`:`<small>${mode==='cards'?'凭直觉，选一张你喜欢的牌':'选择交给转盘，好好吃饭交给你'}</small>`}</div>`}
function action(){return `<button class="primary" onclick="${result?'confirmResult()':mode==='wheel'?'draw()':'hintCards()'}">${result?['就吃这个','就做这 1 道菜','就去这家'][scene]:mode==='wheel'?'转一下，看看吃什么':'选一张，揭晓这一餐'}</button>${result?'<div style="text-align:center"><button class="secondary" onclick="replaceResult()">换一个</button></div>':''}`}
function headerMarkup(){return `<header class="top"><span class="brand">${variant==='A'?'这一餐':variant==='B'?'一餐一签':'今日饭票'}</span><select class="meal" aria-label="餐次" onchange="setMeal(this.value)">${['早餐','午餐','晚餐','夜宵'].map(x=>`<option ${x===meal?'selected':''}>${x}</option>`).join('')}</select></header>`}
function VariantA(){return headerMarkup()+`<div class="intro"><div><h2>今天，吃点什么？</h2><p class="sub">少一点纠结，多一点好胃口。</p></div><div class="seal">☺</div></div>`+sceneButtons()+modeButtons()+stage()+resultArea()+action()}
function VariantB(){return headerMarkup()+sceneButtons()+`<h2>给这一餐<br>一点期待。</h2><p class="sub">不必想好答案，让喜欢慢慢出现。</p>`+stage()+modeButtons()+resultArea()+action()}
function VariantC(){return headerMarkup()+sceneButtons()+`<p class="sub">${meal}营业中　 /　 今天也要好好吃饭</p><section class="ticket"><div class="ticket-head"><h2>这一餐的安排</h2><span>${candidates().length} 个候选</span></div>`+modeButtons()+stage()+resultArea()+`</section><div style="height:18px"></div>`+action()}
function render(){el('phone').className='phone '+variant;el('phone').innerHTML='<div class="status"><span>12:08</span><span>●●●　▰</span></div><div class="app">'+({A:VariantA,B:VariantB,C:VariantC}[variant])()+'</div><nav class="nav">'+['选项库','决定','足迹'].map((n,i)=>`<button class="${i===1?'active':''}" onclick="openTab(${i})"><svg viewBox="0 0 24 24">${icons[i]}</svg>${n}</button>`).join('')+'</nav>';let v=variants[variant];el('brief').innerHTML=`<span class="proto-label">视觉方向原型 · 尚未定稿</span><h1>${v.name}</h1><p>${v.desc}</p><div class="chips">${v.tags.map(t=>`<span>${t}</span>`).join('')}</div><p class="state">当前：${['吃什么','做什么','去哪吃'][scene]} / ${meal} / ${mode==='wheel'?'转盘':'抽卡'}<br>结果：${result||'尚未抽取'} · 临时排除 ${excluded.size} 项<br>此示例每轮抽取 1 项，刷新后清空记录。<br>下方箭头切换方案，也可以使用键盘 ← →。</p><div class="count">${variant} / C</div>`;el('variant-label').textContent=variant+' · '+v.name}
function toast(t){el('toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el('toast').textContent='',2600)}
function cycle(d){if(busy)return;variant=['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3];mode=variants[variant].mode;result=null;let url=new URL(location.href);url.searchParams.set('variant',variant);window.history.replaceState(null,'',url);render()}
function setMode(m){if(busy||result){toast('请先确认这一餐，再切换抽取方式');return}mode=m;render()}
function modal(html){el('dialog').innerHTML=html;el('dialog').showModal()}
function closeModal(){el('dialog').close()}
function restart(fn){if(busy)return;if(result){window.pendingChange=fn;modal('<h3>重新开始这一轮？</h3><p>切换后会清空当前结果，保留本次排除。</p><button onclick="closeModal()">继续当前选择</button><button onclick="closeModal();result=null;pendingChange();render()">重新开始</button>')}else{fn();render()}}
function setScene(i){restart(()=>scene=i)}function setMeal(m){restart(()=>meal=m);render()}
function hintCards(){toast(result?'请先确认当前结果':'轻点上方任意一张牌')}
function draw(card){if(busy||result)return;let names=candidates();if(!names.length){modal('<h3>暂时没有候选了</h3><button onclick="excluded.clear();closeModal();render()">恢复本次排除</button>');return}busy=true;let i=Math.floor(Math.random()*names.length),chosen=names[i];if(mode==='wheel'){el('disc').style.transform=`rotate(${1800-(i+.5)*360/names.length}deg)`}else{let c=el('card'+card);c.classList.add('reveal');c.querySelector('span').textContent=chosen}let wait=matchMedia('(prefers-reduced-motion: reduce)').matches?100:mode==='wheel'?1550:750;setTimeout(()=>{busy=false;result=chosen;render();if(mode==='wheel')el('disc').style.cssText=`transition:none;transform:rotate(${1800-(i+.5)*360/names.length}deg)`;else{let c=el('card'+card);c.classList.add('reveal');c.querySelector('span').textContent=chosen}},wait)}
function confirmResult(){if(!result)return;history.unshift({name:result,scene,meal,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});result=null;render();toast('这一餐已记入足迹，好好享用吧')}
function replaceResult(){modal('<h3>这次先不选它？</h3><p>可以仅换一个，也可以在本次使用中暂时排除。</p><button onclick="replace(false)">直接换一个</button><button onclick="replace(true)">排除并换一个</button><button onclick="closeModal()">保留</button>')}
function replace(exclude){if(exclude)excluded.add(result);result=null;closeModal();render();if(mode==='wheel')draw();else toast('再选一张牌吧')}
function openTab(i){if(i===1)return;if(busy){toast('正在揭晓，请稍等');return}modal(`<h3>${i===0?'选项库 · 示例':'这一餐的足迹'}</h3>${i===0?'<p>当前场景的示例选项，仅供体验。</p>'+pools[scene].map(x=>`<div class="listrow">${x}</div>`).join(''):history.length?history.map(x=>`<div class="listrow">${x.name}<small>今天 ${x.time} · ${x.meal} · ${['吃什么','做什么','去哪吃'][x.scene]}</small></div>`).join(''):'<p>还没有记录。确认一餐后，就会出现在这里。</p>'}<button onclick="closeModal()">返回</button>`)}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable||el('dialog').open)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
if(!['localhost','127.0.0.1',''].includes(location.hostname))el('switcher').hidden=true;
render();
</script></body></html>
