<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae3;color:#342f29;font:15px/1.5 'Microsoft YaHei',system-ui,sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button{color:inherit}button:disabled{cursor:wait;opacity:.5}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #235fc4;outline-offset:4px}button:active:not(:disabled){transform:scale(.97)}button{transition:transform .15s}h1,h2,p{margin:0}main{max-width:1060px;margin:auto;display:grid;grid-template-columns:330px 402px;gap:100px;align-items:center;min-height:100vh;padding:40px 24px 120px}.eyebrow{font-size:11px;letter-spacing:3px;color:#71675d}.panel h1{font-size:36px;line-height:1.4;letter-spacing:-1px;margin:14px 0}.panel>p{color:#72675d;line-height:1.9}.line{height:1px;background:#d6cdc2;margin:26px 0}.controls{display:grid;gap:17px}.control-title{font-weight:bold;font-size:13px;margin-bottom:9px}.segments{display:flex;gap:7px}.segments button{border:1px solid #d3c8bb;background:#f6f2eb;border-radius:9px;padding:11px 12px;flex:1;font-size:13px;min-height:44px}.segments button.active{background:#342f29;color:#fff;border-color:#342f29}.checks{display:flex;gap:22px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:8px;min-height:44px}.checks input{width:18px;height:18px;accent-color:#b74625}.hint{font-size:12px;color:#75695e;margin-top:13px;line-height:1.8}.state{font-size:12px;padding:12px 0;color:#665b50;border-top:1px solid #d6cdc2;margin-top:22px}.phone{--paper:#fffaf1;--ink:#372e25;--accent:#b94320;--muted:#776658;--soft:#f4e9d8;--stroke:#e9ddcb;background:var(--paper);color:var(--ink);border:7px solid #fff;border-radius:42px;box-shadow:0 24px 60px #4f3a231a;overflow:hidden;min-height:792px;display:flex;flex-direction:column;position:relative}.status{display:flex;justify-content:space-between;padding:16px 24px 4px;font-size:12px;font-weight:700}.screen{padding:20px 23px 18px;flex:1}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:1px;font-size:18px}.meal{font-size:12px;background:var(--soft);padding:7px 12px;border-radius:30px}.hero{margin-top:30px;position:relative}.hero small{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:bold}.hero h2{font-size:34px;line-height:1.35;letter-spacing:-1.5px;margin:6px 0 9px}.hero p,.sub{font-size:12px;color:var(--muted)}.hero-mark{position:absolute;right:0;top:5px;width:64px;height:64px;transform:rotate(12deg)}.meta{display:flex;justify-content:space-between;margin:23px 0 2px;color:var(--muted);font-size:11px}.stage{position:relative;display:grid;place-items:center;padding:17px 0 12px}.wheel{width:100%;max-width:308px;aspect-ratio:1;position:relative;border:9px solid #f5deae;border-radius:50%;box-shadow:0 5px 0 #ddc08d}.wheel svg.disc{display:block;width:100%;height:100%;border-radius:50%;will-change:transform}.pointer{position:absolute;z-index:3;left:calc(50% - 13px);top:-18px;width:26px;height:36px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 53%,50% 100%,0 53%)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:69px;height:69px;background:var(--paper);border:5px solid #fff;border-radius:50%;box-shadow:0 2px 6px #63472425;display:grid;place-content:center;text-align:center;font-size:17px;font-weight:bold;line-height:1.3}.hub small{font-size:8px;letter-spacing:2px;color:var(--muted)}.result{min-height:92px;display:flex;align-items:center;justify-content:center;gap:15px;text-align:center;padding:15px 0}.result .food{width:66px;height:66px}.result small{font-size:11px;color:var(--muted)}.result strong{display:block;font-size:24px;margin-top:3px}.idle-copy{font-size:13px;color:var(--muted)}.primary{border:0;border-radius:18px;background:var(--accent);color:#fff;width:100%;min-height:55px;font-weight:bold;font-size:16px;box-shadow:0 4px 0 #8e311a}.footnote{text-align:center;color:var(--muted);font-size:10px;margin-top:13px}.nav{display:flex;padding:11px 10px 20px;border-top:1px solid var(--stroke);background:var(--paper)}.nav button{flex:1;border:0;background:none;font-size:11px;min-height:49px;display:grid;place-items:center;gap:5px;color:var(--muted)}.nav button.active{color:var(--accent);font-weight:bold}.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}.list-title{font-size:29px;margin:26px 0 8px}.library{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.foodcard{padding:12px;background:#fff8;border:1px solid var(--stroke);border-radius:18px}.foodcard .food{display:block;width:72px;height:62px;margin:0 auto 10px}.foodcard strong{display:block;font-size:14px}.foodcard small{font-size:10px;color:var(--muted)}.history-row{display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--stroke);padding:18px 0}.history-row .food{width:56px;height:56px}.history-row strong{display:block}.history-row small{color:var(--muted);font-size:11px}.empty{text-align:center;padding:90px 0 50px}.empty .food{width:110px;height:110px;margin-bottom:22px}.empty p{font-size:12px;color:var(--muted);margin:10px 0 28px}.B{--paper:#fff5c9;--ink:#30244e;--accent:#6540b8;--muted:#655676;--soft:#ecdefa;--stroke:#c9b891;border-color:#30244e;box-shadow:10px 12px 0 #d9ccab}.B .brand{background:#30244e;color:#fff5c9;padding:4px 10px;transform:rotate(-3deg);font-size:15px}.B .meal{border:1.5px solid var(--ink);background:#fff}.B .hero{text-align:center;margin-top:26px}.B .hero h2{font-size:40px;font-weight:900;line-height:1.22;transform:rotate(-3deg);margin:10px 0 15px}.B .hero small{background:#f5b8da;padding:4px 12px;border:1.5px solid var(--ink);border-radius:20px;color:var(--ink)}.B .hero-mark{display:none}.B .meta{margin-top:20px}.B .wheel{border:9px solid #30244e;box-shadow:5px 7px 0 #cfaf67}.B .hub{background:#fff5c9;border:3px solid #30244e}.B .pointer{background:#ee547c}.B .result{background:#fff;border:2px solid var(--ink);border-radius:12px;margin:17px 0;min-height:78px;padding:9px;box-shadow:4px 4px 0 #30244e}.B .primary{border:2px solid #30244e;border-radius:12px;box-shadow:4px 4px 0 #30244e;background:#6540b8}.B .foodcard{background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 #30244e}.B .nav{border-top:2px solid #30244e}.B .nav button.active{background:#ecdefa;border-radius:10px}.B .footnote{margin-top:14px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;background:#28262b;color:#fff;padding:7px;border-radius:60px;box-shadow:0 6px 25px #0002;z-index:10;white-space:nowrap;font-size:13px}.switcher button{border:0;border-radius:50%;background:#ffffff18;color:#fff;width:44px;height:44px;font-size:20px}.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#302c29;color:#fff;padding:12px 20px;border-radius:12px;z-index:20;font-size:13px;max-width:90vw}.toast:empty{display:none}.reveal{animation:pop .45s cubic-bezier(.2,.8,.3,1.2)}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}@media(max-width:850px){main{grid-template-columns:minmax(0,402px);justify-content:center;gap:28px;padding:24px 16px 110px}.panel h1{font-size:28px}.panel .line{margin:18px 0}.panel>p{font-size:13px}.phone{width:100%}.controls{gap:12px}.state{margin-top:12px}.hero h2{font-size:31px}.B .hero h2{font-size:36px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main><aside class="panel"><div class="eyebrow">这一餐 / 设计体验室</div><h1 id="direction"></h1><p id="description"></p><div class="line"></div><div class="controls"><div><div class="control-title">转盘节奏</div><div class="segments" id="speeds"></div></div><div><div class="control-title">停下时的反馈</div><div class="checks"><label><input id="sound" type="checkbox">轻音效</label><label><input id="haptic" type="checkbox" checked>轻震动</label></div></div><div><div class="control-title">预览餐段</div><div class="segments" id="periods"></div></div></div><p class="hint">这些是原型调节项，不是应用内设置。桌面可体验声音；震动需手机浏览器支持。记录仅在本页临时保留，刷新即清空。</p><div class="state" id="state" aria-live="polite"></div></aside><section class="phone" id="phone" aria-label="手机应用原型"></section></main><div class="switcher"><button onclick="cycle()" aria-label="上一方案">←</button><span id="variantLabel"></span><button onclick="cycle()" aria-label="下一方案">→</button></div><div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const foods=[{id:'rice',name:'黄焖鸡米饭',type:'rice',periods:[1,2]},{id:'noodles',name:'牛肉面',type:'noodle',periods:[1,2,3]},{id:'buns',name:'小笼包',type:'bun',periods:[0,1]},{id:'pancake',name:'煎饼果子',type:'wrap',periods:[0,1]},{id:'porridge',name:'皮蛋瘦肉粥',type:'rice',periods:[0,2,3]},{id:'burger',name:'汉堡套餐',type:'burger',periods:[1,2]},{id:'soy-milk',name:'豆浆',type:'drink',periods:[0,1,2,3]},{id:'soy-beverage',name:'豆奶',type:'drink',periods:[0,1,2,3]}];
const names=['早餐','午餐','晚餐','夜宵'];let variant=new URLSearchParams(location.search).get('variant')==='B'?'B':'A',period=1,speed=2500,tab=1,result=null,busy=false,records=[],angle=0,audioContext;
function foodArt(type){const art={rice:'<ellipse cx="50" cy="47" rx="33" ry="19" fill="#fff8df"/><path d="M17 47Q20 85 50 85Q80 85 83 47Z" fill="#eaa371"/><ellipse cx="50" cy="47" rx="33" ry="15" fill="#f5dfaa"/><path d="m28 45 8-9 12 3 3 12-13 3zm28-10 14 5-2 14-15-4z" fill="#a75b32"/><path d="m38 37 5-6 7 5m14 17 8-3" stroke="#66915d" stroke-width="6" stroke-linecap="round"/>',noodle:'<path d="M15 47Q18 83 50 83Q82 83 85 47Z" fill="#84aca0"/><ellipse cx="50" cy="47" rx="35" ry="17" fill="#e5bb79"/><path d="M28 43q7-11 14 0t14 0t14 0M29 51q7-11 14 0t14 0t14 0" fill="none" stroke="#fff1b7" stroke-width="4"/><path d="m62 22-5 28m14-27-7 29" stroke="#755140" stroke-width="3" stroke-linecap="round"/><path d="m31 39 9-4 6 6-10 4z" fill="#ae6b4c"/>',bun:'<ellipse cx="50" cy="72" rx="38" ry="12" fill="#d7a96d"/><path d="M22 64Q14 49 30 37Q46 17 62 33Q90 45 79 65Q51 84 22 64" fill="#ffe9b7" stroke="#dca575" stroke-width="2"/><path d="M50 31 37 49m13-18 1 20m1-20 14 17" stroke="#dca575" stroke-width="3" stroke-linecap="round"/>',wrap:'<path d="m19 36 58-8 9 38-52 20Z" fill="#d6a353"/><path d="m23 38 52-5 7 9-52 9Z" fill="#709365"/><path d="m28 49 54-8 4 7-52 11Z" fill="#e38c6e"/><path d="m34 57 52-9-8 26-44 12Z" fill="#f5d188"/><path d="m40 64 29-7m-24 15 16-3" stroke="#d5a255" stroke-width="3" stroke-linecap="round"/>',burger:'<path d="M20 45Q23 18 50 18Q77 18 80 45Z" fill="#edb45c"/><path d="m32 31 3-3m12 1 4-2m13 7 3-2" stroke="#fff0c0" stroke-width="3"/><path d="M20 51h60" stroke="#739557" stroke-width="9" stroke-linecap="round"/><path d="M21 62h58" stroke="#8b5138" stroke-width="12" stroke-linecap="round"/><path d="m22 55 22 2 8 9 16-9 13-2" fill="#f7cb54"/><path d="M20 72h60Q79 85 50 85Q21 85 20 72" fill="#edb45c"/>',drink:'<path d="m29 28 5 57h34l5-57Z" fill="#f1dfb2" stroke="#bd9774" stroke-width="2"/><ellipse cx="51" cy="28" rx="22" ry="6" fill="#fff1d5"/><path d="m53 47 7-35 11-5" fill="none" stroke="#91aba0" stroke-width="5" stroke-linecap="round"/><path d="M36 53h31v22H36Z" fill="#91aba0"/><path d="M45 63q6-8 12 0-6 9-12 0" fill="#fff6df"/>'};return `<svg class="food" viewBox="0 0 100 100" aria-hidden="true">${art[type]||art.rice}</svg>`}
const pool=()=>foods.filter(x=>x.periods.includes(period));
function wheel(){const list=pool(),n=list.length,colors=variant==='A'?['#efca91','#d9e5c3','#f2bda9','#f8e2a3','#bcd6cb','#dfc9dc','#f3d3af']:['#f5b9db','#bcb1f0','#abd8af','#ffd567','#a8cbe9','#ffac7d','#d9b3ea'];return `<div class="stage"><div class="wheel"><div class="pointer"></div><svg class="disc" id="disc" viewBox="0 0 300 300" style="transform:rotate(${angle}deg)">${list.map((f,i)=>{let a=(i*360/n-90)*Math.PI/180,b=((i+1)*360/n-90)*Math.PI/180,m=(a+b)/2;return `<path d="M150 150L${150+149*Math.cos(a)} ${150+149*Math.sin(a)}A149 149 0 0 1 ${150+149*Math.cos(b)} ${150+149*Math.sin(b)}Z" fill="${colors[i%colors.length]}" stroke="${variant==='A'?'#fffaf1':'#30244e'}" stroke-width="2"/><g transform="translate(${150+99*Math.cos(m)},${150+99*Math.sin(m)}) rotate(${(i+.5)*360/n})"><text text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#372e39">${f.name}</text><circle cy="23" r="3" fill="#372e3955"/></g>`}).join('')}</svg><div class="hub">开饭<small>GOOD FOOD</small></div></div></div>`}
function header(){return `<header class="top"><span class="brand">这一餐</span><span class="meal">${names[period]} · 吃什么</span></header>`}
function resultArea(){return `<div class="result ${result?'reveal':''}" aria-live="polite">${result?foodArt(result.type)+`<div><small>这一餐，就吃点喜欢的</small><strong>${result.name}</strong></div>`:`<div class="idle-copy">${busy?'让好胃口，再转一会儿…':'不必想好答案，转一下就知道。'}</div>`}</div>`}
function VariantA(){return header()+`<div class="hero"><small>好好吃饭 · 好好生活</small><h2>今天，吃点什么？</h2><p>把纠结留给转盘，把期待留给下一口。</p><div class="hero-mark">${foodArt('burger')}</div></div><div class="meta"><span>为${names[period]}准备的灵感</span><span>${pool().length} 个候选 · 等概率</span></div>`+wheel()+resultArea()+action()}
function VariantB(){return header()+`<div class="hero"><small>好胃口，现在开场</small><h2>纠结暂停。<br>美味转起来！</h2><p>今天的快乐，从这一口开始。</p></div><div class="meta"><span>今日${names[period]}局</span><span>${pool().length} 个候选 · 等概率</span></div>`+wheel()+resultArea()+action()}
function action(){return `<button class="primary" id="draw" onclick="${result?'confirmResult()':'draw()'}" ${busy?'disabled':''}>${busy?'正在挑选…':result?'就吃这个':'转一下，开饭'}</button><p class="footnote">${result?'确认之后，才会记入足迹':'一点小期待，一顿好好吃的饭'}</p>`}
function library(){return header()+`<h2 class="list-title">每一餐的灵感</h2><p class="sub">8 个小小提案，总有一口合心意。</p><div class="library">${foods.map(f=>`<article class="foodcard">${foodArt(f.type)}<strong>${f.name}</strong><small>${f.periods.map(p=>names[p]).join(' · ')}</small></article>`).join('')}</div>`}
function historyPage(){return header()+`<h2 class="list-title">好好吃饭的足迹</h2><p class="sub">记下每一次不再纠结的决定。</p>${records.length?`<div class="meta"><span>今天</span><span>${records.length} 次决定</span></div>`+records.map(r=>`<article class="history-row">${foodArt(r.food.type)}<div><strong>${r.food.name}</strong><small>${r.time} · ${names[r.period]} · 吃什么</small></div></article>`).join(''):`<div class="empty">${foodArt('rice')}<h3>第一餐，值得期待</h3><p>确认一次选择，就会在这里留下足迹。</p><button class="primary" onclick="setTab(1)">去决定这一餐</button></div>`}`}
const icons=['<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 3v18M13 8h4M13 12h4"/>','<circle cx="12" cy="12" r="9"/><path d="m12 5 2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>','<path d="M5 4h14v17H5zM8 2v5M16 2v5M8 11h8M8 15h5"/>'];
function render(){const meta=variant==='A'?['温暖的一餐','奶油色的留白、柔和食物色与小插画。像走进一家喜欢的小店，轻松决定下一餐。']:['开饭游乐场','撞色转盘、贴纸标题与有力度的按钮。把每天的纠结，变成一次小小的游戏。'];$('direction').textContent=meta[0];$('description').textContent=meta[1];$('variantLabel').textContent=variant+' · '+meta[0];$('phone').className='phone '+variant;$('phone').innerHTML=`<div class="status"><span>${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}</span><span>▰ ▰ ▰</span></div><div class="screen">${tab===1?(variant==='A'?VariantA():VariantB()):tab===0?library():historyPage()}</div><nav class="nav" aria-label="主导航">${['选项库','决定','足迹'].map((name,i)=>`<button ${busy?'disabled':''} class="${tab===i?'active':''}" aria-current="${tab===i?'page':'false'}" onclick="setTab(${i})"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[i]}</svg>${name}</button>`).join('')}</nav>`;$('speeds').innerHTML=[[1200,'轻快 · 1.2s'],[2500,'适中 · 2.5s'],[4000,'期待 · 4s']].map(([s,t])=>`<button class="${speed===s?'active':''}" aria-pressed="${speed===s}" onclick="setSpeed(${s})" ${busy?'disabled':''}>${t}</button>`).join('');$('periods').innerHTML=names.map((p,i)=>`<button class="${period===i?'active':''}" aria-pressed="${period===i}" onclick="setPeriod(${i})" ${busy?'disabled':''}>${p}</button>`).join('');$('state').textContent=`方案 ${variant} · ${names[period]} · ${busy?'旋转中':result?'待确认：'+result.name:'等待抽取'} · 已确认 ${records.length} 次`;$('sound').disabled=busy;$('haptic').disabled=busy;document.querySelectorAll('.switcher button').forEach(b=>b.disabled=busy)}
function toast(t){$('toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').textContent='',2800)}
function cycle(){if(busy)return;variant=variant==='A'?'B':'A';const url=new URL(location.href);url.searchParams.set('variant',variant);window.history.replaceState(null,'',url);render()}
function setSpeed(s){if(!busy){speed=s;render()}}function setPeriod(p){if(busy||p===period)return;if(result&&!confirm('切换餐段会清空未确认的结果，重新开始？'))return;period=p;result=null;angle=0;render()}function setTab(t){if(!busy){tab=t;render()}}
function chime(){if(!audioContext)return;[523.25,659.25,783.99].forEach((f,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain(),t=audioContext.currentTime+i*.09;osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.07,t+.015);gain.gain.exponentialRampToValueAtTime(.001,t+.28);osc.connect(gain);gain.connect(audioContext.destination);osc.start(t);osc.stop(t+.3)})}
async function draw(){if(busy||result)return;const sound=$('sound').checked,haptic=$('haptic').checked;busy=true;const list=pool(),i=Math.floor(Math.random()*list.length),chosen=list[i],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=reduced?180:speed;const target=360-(i+.5)*360/list.length,newAngle=angle+(360-angle%360)+360*(speed===1200?3:speed===4000?7:5)+target;render();if(sound){try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume()}catch{toast('此浏览器暂时无法播放声音')}}const disc=$('disc');const animation=disc.animate(reduced?[{opacity:.5},{opacity:1}]:[{transform:`rotate(${angle}deg)`},{transform:`rotate(${newAngle}deg)`}],{duration:wait,easing:'cubic-bezier(.12,.64,.13,1)',fill:'forwards'});await animation.finished;angle=newAngle;result=chosen;busy=false;if(sound)chime();if(haptic&&navigator.vibrate)navigator.vibrate(22);render()}
function confirmResult(){if(!result||busy)return;records.unshift({food:result,period,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});result=null;render();toast('这一餐已记入足迹，好好享用吧')}
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle()}});render();
</script></body></html>
